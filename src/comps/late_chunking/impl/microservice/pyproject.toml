[project]
name = "Intel-Enterprise-RAG-Late_Chunking_Microservice"
version = "3.0.0"
requires-python = ">=3.11,<3.12"

dependencies = [
    "aiohttp>=3.14.3,<4.0.0",
    "docarray[proto,image]>=0.40.0,<1.0.0",
    "fastapi>=0.136.3,<1.0.0",
    "h11>=0.16.0,<1.0.0",
    "huggingface-hub>=0.36.0,<1.0.0",
    "jinja2>=3.1.6,<4.0.0",
    "numpy>=2.2.1,<3.0.0",
    "opentelemetry-api>=1.39.1,<2.0.0",
    "opentelemetry-exporter-otlp>=1.39.1,<2.0.0",
    "opentelemetry-sdk>=1.39.1,<2.0.0",
    "prometheus-fastapi-instrumentator>=8.0.0,<9.0.0",
    "python-dotenv>=1.2.2,<2.0.0",
    "requests>=2.33.1,<3.0.0",
    "shortuuid>=1.0.13,<2.0.0",
    "tokenizers>=0.21.0,<1.0.0",
    "urllib3>=2.8.0,<3.0.0",
    "uvicorn>=0.30.1,<1.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.3,<10.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "fastapi>=0.136.3,<1.0.0",
    "docarray>=0.40.0,<1.0.0",
    "opentelemetry-api>=1.39.1,<2.0.0",
    "opentelemetry-exporter-otlp>=1.39.1,<2.0.0",
    "opentelemetry-sdk>=1.39.1,<2.0.0",
]

[dependency-groups]
security-overrides = [
  "protobuf>=6.33.5,<7.0.0",
]
